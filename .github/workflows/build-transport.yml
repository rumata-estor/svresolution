      - name: Collect transport package
        run: |
          set -euxo pipefail
          mkdir -p dist

          echo "Workspace:"
          pwd

          echo "Package directories found:"
          find . -type d -name packages -print || true

          echo "Transport packages found:"
          find . -type f -name '*.transport.zip' -print || true

          package_file="$(find . -type f -name '*.transport.zip' -print -quit)"

          if [ -z "$package_file" ]; then
            echo "::error::No .transport.zip file was produced by _build/build.transport.php"
            echo "Diagnostic file list:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          cp "$package_file" dist/
          ls -lah dist/
